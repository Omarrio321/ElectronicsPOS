{% extends "base.html" %}

{% block title %}Page Not Found - {{ company_name }}{% endblock %}

{% block head %}
<style>
    .error-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; padding:2rem; }
    .error-code { font-size:6rem; font-weight:800; color:var(--blue-100,#DBEAFE); line-height:1; letter-spacing:-0.04em; margin-bottom:0; }
    .error-icon { font-size:3rem; color:var(--blue-400); margin-bottom:1rem; }
    .error-title { font-size:1.5rem; font-weight:700; color:var(--gray-900); margin-bottom:0.5rem; }
    .error-desc { font-size:0.9375rem; color:var(--gray-500); max-width:380px; margin:0 auto 1.75rem; }
    .error-actions { display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center; }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-code">404</div>
    <div class="error-icon"><i class="fas fa-search"></i></div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you are looking for doesn't exist or may have been moved.</p>
    <div class="error-actions">
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
            <i class="fas fa-home" style="font-size:0.75rem;"></i> Go to Dashboard
        </a>
        <button onclick="history.back()" class="btn btn-light" style="border:var(--border);">
            <i class="fas fa-arrow-left" style="font-size:0.75rem;"></i> Go Back
        </button>
    </div>
</div>
{% endblock %}
